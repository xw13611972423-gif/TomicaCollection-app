name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch expo-modules-jsi data-race (Swift 6.2)
        run: |
          python3 - <<'PY'
          p = 'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift'
          s = open(p).read()
          subs = [
            ('nonisolated(unsafe) let slot = buffer.baseAddress!', 'let slot = UncheckedSendable(buffer.baseAddress!)'),
            ('expo.emplaceUndefined(slot)', 'expo.emplaceUndefined(slot.value)'),
            ('expo.destroyValues(slot, 1)', 'expo.destroyValues(slot.value, 1)'),
            ('JavaScriptValue.Slot(slot)', 'JavaScriptValue.Slot(slot.value)'),
            ('body(slot.pointee)', 'body(slot.value.pointee)'),
          ]
          for old, new in subs:
            n = s.count(old)
            assert n == 1, f"expected 1 occurrence of {old!r}, found {n}"
            s = s.replace(old, new)
          open(p, 'w').write(s)
          print("patched OK")
          PY
          grep -q 'UncheckedSendable(buffer.baseAddress!)' node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift && echo "verified"

      - name: Prebuild iOS project
        run: CI=1 npx expo prebuild --platform ios --no-install

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild \
            -workspace TomicaCollectionapp.xcworkspace \
            -scheme TomicaCollectionapp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY=""

      - name: Package IPA
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          IPA="TomicaCollectionapp-${VERSION}-unsigned.ipa"
          zip -qry "$IPA" Payload
          ls -lh "$IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomicaCollectionapp-${{ env.VERSION }}-unsigned.ipa
          path: TomicaCollectionapp-*-unsigned.ipa
          retention-days: 7
