name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch expo-modules-jsi concurrency flag
        run: |
          perl -ni -e 'print unless /NonisolatedNonsendingByDefault/' node_modules/expo-modules-jsi/apple/Package.swift
          if grep -q "NonisolatedNonsendingByDefault" node_modules/expo-modules-jsi/apple/Package.swift; then
            echo "ERROR: patch failed"; exit 1
          else
            echo "patched OK"
          fi

      - name: Prebuild iOS project
        run: CI=1 npx expo prebuild --platform ios --no-install

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned app
        run: |
          cd ios
          xcodebuild \
            -workspace TomicaCollectionapp.xcworkspace \
            -scheme TomicaCollectionapp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal

      - name: Package IPA
        run: |
          APP=$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TomicaCollectionapp-unsigned.ipa Payload
          ls -lh TomicaCollectionapp-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomicaCollectionapp-unsigned.ipa
          path: TomicaCollectionapp-unsigned.ipa
          retention-days: 7
